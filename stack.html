<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <div class="form-group">
            <form class="was-validated">
           

                <h2 class="bg-success text-center text-white">stack form</h2>

                <label for="username">username</label>
                <input type="text" name="" id="username" class="form-control" placeholder="username" required>

                <div class="valid-feedback">valid</div>

                <label for="password">password</label>
                <input type="password" name="" id="password" class="form-control" placeholder="password" required>

                <div class="invalid-feedback">add password</div><br>

                <label for="address">address</label>
                <br>
                <textarea name="address" id="address" cols="10" rows="4"></textarea>

                <br>

                <button type="button" class="btn btn-outline-info">submit</button>

                <br>

                <button type="button" class="btn btn-warning btn-lg">forget password</button>

            </form>
        </div>
    </div>
</body>
</html>
